<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业辐射剂量与异常事件</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>职业辐射剂量与异常事件</h1><p>合并监测读数，比较历史剂量并管理超限调查、医学随访与报告期限</p><p>剂量与调查水平之比决定升级程度，超过阈值必须进入调查；更正剂量不能覆盖已确认审计记录。</p><p>坏损剂量计（遗失/未回收/故障）登记补测事件后原读数退出累计，另一名监测员用备用剂量计复核并回写替代剂量；补测未完成不能结案。</p><button onclick="loadItems()">刷新列表</button> <button onclick="loadIncidents()">补测事件</button> <button onclick="loadAnnual()">年度累计</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>const H={'X-Actor':'demo','X-Role':'viewer'};async function show(u){const r=await fetch(u,{headers:H});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}function loadItems(){return show('/api/items')}function loadIncidents(){return show('/api/dosimeter-incidents')}function loadAnnual(){return show('/api/dose/annual?year='+new Date().getFullYear())}</script></body></html>
